<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Pixel Art Scaler</title>
  <style>
    :root{--bg:#0f1724;--card:#0b1220;--muted:#9aa4b2;--accent:#60a5fa}
    *{box-sizing:border-box;font-family:Inter,ui-sans-serif,system-ui,Segoe UI,Roboto,"Helvetica Neue",Arial}
    html,body{height:100%;margin:0;background:linear-gradient(180deg,#071025 0%, #071827 100%);color:#e6eef6}
    .wrap{max-width:1100px;margin:28px auto;padding:20px}
    header{display:flex;align-items:center;gap:16px}
    h1{margin:0;font-size:20px}
    p.lead{margin:0;color:var(--muted);font-size:13px}
    .controls{display:flex;gap:12px;align-items:center;margin-top:16px;flex-wrap:wrap}
    .card{background:rgba(255,255,255,0.03);padding:12px;border-radius:10px;box-shadow:0 6px 18px rgba(2,6,23,0.6)}
    .drop{margin-top:18px;border:2px dashed rgba(255,255,255,0.06);border-radius:10px;padding:22px;text-align:center;cursor:pointer}

    .files-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;margin-top:14px}
    .file-card{background:linear-gradient(180deg,rgba(255,255,255,0.02),rgba(255,255,255,0.01));padding:10px;border-radius:8px;display:flex;flex-direction:column;gap:8px}
    .thumb{width:100%;height:160px;display:block;object-fit:contain;background:#071022;border-radius:6px}
    .row{display:flex;gap:8px;align-items:center}
    .grow{flex:1}
    label{font-size:12px;color:var(--muted)}
    input[type=range]{width:220px}
    .btn{background:var(--accent);border:none;padding:8px 10px;border-radius:8px;color:#04233d;font-weight:600;cursor:pointer}
    .btn.ghost{background:transparent;border:1px solid rgba(255,255,255,0.06);color:var(--muted)}
    .small{font-size:12px;padding:6px 8px}
    footer{margin-top:18px;color:var(--muted);font-size:12px}
    .meta{font-size:12px;color:var(--muted)}
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div>
        <h1>Upscale Pixel Art</h1>
        <p class="lead">Drag & drop images, choose a scale and download upsaled result.</p>
      </div>
    </header>

    <div class="controls">
      <div class="card">
        <div style="display:flex;align-items:center;gap:12px;">
          <label class="meta">Scale: <strong id="scaleLabel">4×</strong></label>
          <input id="scaleRange" type="range" min="1" max="32" value="4" step="1">
          <input id="scaleNumber" type="number" min="1" max="32" value="4" style="width:64px;padding:6px;border-radius:6px;border:1px solid rgba(255,255,255,0.06);background:transparent;color:inherit">
        </div>
        <div style="margin-top:8px;display:flex;gap:8px;align-items:center;flex-wrap:wrap">
          <label style="display:flex;align-items:center;gap:8px"><input id="pixelate" type="checkbox" checked> <span class="meta">Nearest neighbor scaling (edges will be blurry if disabled)</span></label>
          <button id="clearBtn" class="btn ghost small">Clear all</button>
          <button id="downloadAll" class="btn small">Download ZIP</button>
        </div>
      </div>

      <div class="card" style="padding:8px">
        <div style="display:flex;gap:8px;align-items:center">
          <label class="meta">Add files</label>
          <input id="fileInput" type="file" accept="image/*" multiple style="display:block">
          <button id="pasteBtn" class="btn small">Paste Image(s)</button>
        </div>
        <div style="margin-top:8px;color:var(--muted);font-size:12px">drag & drop to the area below or click to pick files..</div>
      </div>
    </div>

    <div id="dropArea" class="drop card">
      <div style="font-weight:700">Drop images here</div>
      <div class="meta">PNG, GIF, JPG multiple files supported. Animated GIFs will upscale only their first frame.</div>
    </div>

    <div id="files" class="files-grid"></div>

    <footer>
      <div class="meta">Made for use with pixel art.</div>
    </footer>
  </div>

</body>
</html>
